<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Fixture</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--brand:#ff5a1f;--ink:#111418;--paper:#f6f3ee;--radius:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 18px/1.6 Georgia,serif}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 48px;border-bottom:1px solid #d9d3c7}
header img{width:48px;height:48px}
nav a{margin-left:28px;color:var(--ink);text-decoration:none;font:600 15px/1 Helvetica,Arial,sans-serif;letter-spacing:.04em}
.hero{padding:96px 48px 72px}
.hero h1{margin:0 0 16px;font:700 72px/1.02 Georgia,serif;letter-spacing:-.02em;animation:slide-in 900ms cubic-bezier(.16,1,.3,1) both}
.hero p{max-width:620px;margin:0 0 32px}
@keyframes slide-in{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.btn{display:inline-block;padding:16px 32px;background:var(--brand);color:#fff;border-radius:var(--radius);font:700 16px/1 Helvetica,Arial,sans-serif;text-decoration:none;transition:background-color 300ms cubic-bezier(.4,0,.2,1),transform 300ms cubic-bezier(.4,0,.2,1)}
.btn:hover{background:#c43c08;transform:translateY(-3px)}
.spinner{width:24px;height:24px;border:3px solid var(--ink);border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;display:inline-block;margin-left:16px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:48px}
.card{height:360px;border-radius:var(--radius);padding:28px;background:#ffffff;box-shadow:0 12px 40px rgba(17,20,24,.12)}
.card h3{margin:0 0 8px;font:700 24px/1.2 Helvetica,Arial,sans-serif}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}
footer{padding:96px 48px;background:var(--ink);color:var(--paper)}
</style></head><body>
<header><img src="/logo.svg" alt="logo"><nav><a href="#a">Work</a><a href="#b">About</a><a href="#c">Contact</a></nav></header>
<section class="hero"><h1>Measured, not guessed.</h1><p>A deterministic fixture page used by the pixel-clone end-to-end test.</p><a class="btn" href="#go">Get started</a><span class="spinner"></span></section>
<section class="grid">
<div class="card reveal"><h3>One</h3><p>First card.</p></div>
<div class="card reveal"><h3>Two</h3><p>Second card.</p></div>
<div class="card reveal"><h3>Three</h3><p>Third card.</p></div>
<div class="card reveal"><h3>Four</h3><p>Fourth card.</p></div>
<div class="card reveal"><h3>Five</h3><p>Fifth card.</p></div>
<div class="card reveal"><h3>Six</h3><p>Sixth card.</p></div>



</section>
<footer><h2>Footer</h2></footer>
<script>
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.2});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script></body></html>
