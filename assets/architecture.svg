<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="t d">
  <title id="t">pixel-clone architecture</title>
  <desc id="d">Five-stage pipeline: profile and bypass gates, multi-viewport extraction, Tailwind generation or WebGL/DOM replay, full-page segmented pixelmatch diff, self-healing convergence loop.</desc>
  <defs>
    <radialGradient id="glow" cx="22%" cy="8%" r="75%">
      <stop offset="0" stop-color="#1d2a5c" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#0b1020" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#070a12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cf2ff"/>
      <stop offset="0.5" stop-color="#8b7bff"/>
      <stop offset="1" stop-color="#ff6ad5"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141b2e"/>
      <stop offset="1" stop-color="#0e1424"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf2ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b7bff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="edgeHot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6ad5" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#8b7bff" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b7bff"/>
    </marker>
    <marker id="arrowHot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff6ad5"/>
    </marker>
    <style>
      .sans { font-family: Inter, "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
      .h { font-size: 19px; font-weight: 700; fill: #eef2ff; }
      .s { font-size: 13.5px; fill: #9aa6c7; }
      .k { font-size: 12px; fill: #7cf2ff; letter-spacing: 0.4px; }
      .n { font-size: 12px; font-weight: 700; fill: #0b1020; }
      .metric { font-size: 26px; font-weight: 800; fill: #eef2ff; }
      .mlabel { font-size: 12.5px; fill: #8792b5; }
    </style>
  </defs>

  <rect width="1280" height="660" fill="#070a12"/>
  <rect width="1280" height="660" fill="url(#grid)"/>
  <rect width="1280" height="660" fill="url(#glow)"/>

  <!-- wordmark -->
  <g transform="translate(48 70)">
    <g transform="translate(0 -30)">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#7cf2ff"/>
      <rect x="12" y="0" width="10" height="10" rx="2" fill="#8b7bff"/>
      <rect x="0" y="12" width="10" height="10" rx="2" fill="#8b7bff"/>
      <rect x="12" y="12" width="10" height="10" rx="2" fill="#ff6ad5"/>
    </g>
    <text x="34" y="-12" class="mono" font-size="34" font-weight="800" fill="url(#brand)">pixel-clone</text>
    <text x="0" y="24" class="sans" font-size="16" fill="#aab4d4">Telemetry-driven, pixel-accurate website reverse-engineering &amp; replication for AI coding agents</text>
  </g>
  <g transform="translate(1232 52)" text-anchor="end">
    <text class="mono k" y="0">AGENT SKILL + MCP SERVER</text>
    <text class="mono" y="22" font-size="12" fill="#6f7aa0">Playwright · CDP · pixelmatch · Next.js · Tailwind</text>
  </g>

  <!-- pipeline cards -->
  <g class="sans">
    <!-- 1 -->
    <g transform="translate(48 150)">
      <rect width="216" height="170" rx="16" fill="url(#card)" stroke="url(#edge)" stroke-width="1.5"/>
      <circle cx="30" cy="32" r="13" fill="#7cf2ff"/><text x="30" y="36.5" text-anchor="middle" class="n">1</text>
      <text x="22" y="76" class="h">Profile</text>
      <text x="22" y="98" class="h">&amp; bypass gates</text>
      <text x="22" y="128" class="s">stack, rendering, scroll</text>
      <text x="22" y="148" class="s">cookie · preloader · enter</text>
    </g>
    <!-- 2 -->
    <g transform="translate(294 150)">
      <rect width="216" height="170" rx="16" fill="url(#card)" stroke="url(#edge)" stroke-width="1.5"/>
      <circle cx="30" cy="32" r="13" fill="#7cf2ff"/><text x="30" y="36.5" text-anchor="middle" class="n">2</text>
      <text x="22" y="76" class="h">Multi-viewport</text>
      <text x="22" y="98" class="h">extraction</text>
      <text x="22" y="128" class="mono k">1440 · 1920 · 390</text>
      <text x="22" y="148" class="s">CDP styles, motion, GLSL</text>
    </g>
    <!-- 3 -->
    <g transform="translate(540 150)">
      <rect width="216" height="170" rx="16" fill="url(#card)" stroke="url(#edge)" stroke-width="1.5"/>
      <circle cx="30" cy="32" r="13" fill="#8b7bff"/><text x="30" y="36.5" text-anchor="middle" class="n">3</text>
      <text x="22" y="76" class="h">Clean Tailwind</text>
      <text x="22" y="98" class="h">or 60 fps replay</text>
      <text x="22" y="128" class="s">hand-authored by default</text>
      <text x="22" y="148" class="s">WebGL/DOM for canvas sites</text>
    </g>
    <!-- 4 -->
    <g transform="translate(786 150)">
      <rect width="216" height="170" rx="16" fill="url(#card)" stroke="url(#edge)" stroke-width="1.5"/>
      <circle cx="30" cy="32" r="13" fill="#8b7bff"/><text x="30" y="36.5" text-anchor="middle" class="n">4</text>
      <text x="22" y="76" class="h">Full-page</text>
      <text x="22" y="98" class="h">pixelmatch diff</text>
      <text x="22" y="128" class="s">every slice + UI state</text>
      <text x="22" y="148" class="s">per viewport, height gate</text>
    </g>
    <!-- 5 -->
    <g transform="translate(1032 150)">
      <rect width="200" height="170" rx="16" fill="url(#card)" stroke="url(#edgeHot)" stroke-width="1.5"/>
      <circle cx="30" cy="32" r="13" fill="#ff6ad5"/><text x="30" y="36.5" text-anchor="middle" class="n">5</text>
      <text x="22" y="76" class="h">Self-healing</text>
      <text x="22" y="98" class="h">convergence</text>
      <text x="22" y="128" class="s">measure, fix, re-diff</text>
      <text x="22" y="148" class="s">until every slice ≥ 99%</text>
    </g>
  </g>

  <!-- connectors -->
  <g stroke="#8b7bff" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M266 235H290"/>
    <path d="M512 235H536"/>
    <path d="M758 235H782"/>
    <path d="M1004 235H1028"/>
  </g>
  <!-- self-healing loop: 5 back to 3 -->
  <path d="M1132 322 C1132 372 1132 372 1080 372 H700 C648 372 648 372 648 326" fill="none" stroke="#ff6ad5" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowHot)"/>
  <text x="890" y="364" text-anchor="middle" class="mono" font-size="12" fill="#ff9be6">self-healing loop · one root cause per iteration</text>

  <!-- target | clone | diff preview -->
  <g transform="translate(48 420)">
    <text class="mono k" x="0" y="-12">TARGET · CLONE · DIFF</text>
    <g>
      <rect width="150" height="150" rx="12" fill="#0e1424" stroke="#26304d"/>
      <rect x="14" y="16" width="122" height="12" rx="3" fill="#2a3560"/>
      <rect x="14" y="38" width="80" height="34" rx="4" fill="#8b7bff"/>
      <rect x="100" y="38" width="36" height="34" rx="4" fill="#7cf2ff" opacity="0.8"/>
      <rect x="14" y="82" width="122" height="8" rx="2" fill="#3a4672"/>
      <rect x="14" y="96" width="100" height="8" rx="2" fill="#3a4672"/>
      <rect x="14" y="116" width="54" height="20" rx="5" fill="#ff6ad5"/>
    </g>
    <g transform="translate(166 0)">
      <rect width="150" height="150" rx="12" fill="#0e1424" stroke="#26304d"/>
      <rect x="14" y="16" width="122" height="12" rx="3" fill="#2a3560"/>
      <rect x="14" y="38" width="80" height="34" rx="4" fill="#8b7bff"/>
      <rect x="100" y="38" width="36" height="34" rx="4" fill="#7cf2ff" opacity="0.8"/>
      <rect x="14" y="82" width="122" height="8" rx="2" fill="#3a4672"/>
      <rect x="14" y="96" width="100" height="8" rx="2" fill="#3a4672"/>
      <rect x="14" y="116" width="54" height="20" rx="5" fill="#ff6ad5"/>
    </g>
    <g transform="translate(332 0)">
      <rect width="150" height="150" rx="12" fill="#e9ecf4"/>
      <rect x="14" y="16" width="122" height="12" rx="3" fill="#d4d8e4"/>
      <rect x="14" y="38" width="122" height="34" rx="4" fill="#d4d8e4"/>
      <rect x="14" y="82" width="122" height="22" rx="2" fill="#dde1eb"/>
      <rect x="14" y="116" width="54" height="20" rx="5" fill="#d4d8e4"/>
      <rect x="66" y="117" width="3" height="18" fill="#ff2d2d"/>
      <rect x="112" y="99" width="4" height="5" fill="#ff2d2d"/>
    </g>
  </g>

  <!-- metrics -->
  <g class="sans" transform="translate(586 420)">
    <text class="mono k" x="0" y="-12">VERIFIED</text>
    <g>
      <rect width="300" height="68" rx="12" fill="#0e1424" stroke="#26304d"/>
      <text x="20" y="40" class="metric">0.24 s</text>
      <text x="124" y="30" class="mlabel">hero first paint</text>
      <text x="124" y="48" class="mlabel">server-rendered, 1920×1080</text>
    </g>
    <g transform="translate(320 0)">
      <rect width="326" height="68" rx="12" fill="#0e1424" stroke="#26304d"/>
      <text x="20" y="40" class="metric">60 fps</text>
      <text x="124" y="30" class="mlabel">interpolated scroll replay</text>
      <text x="124" y="48" class="mlabel">3-5 ms work per frame</text>
    </g>
    <g transform="translate(0 82)">
      <rect width="300" height="68" rx="12" fill="#0e1424" stroke="#26304d"/>
      <text x="20" y="40" class="metric">3</text>
      <text x="124" y="30" class="mlabel">breakpoints extracted</text>
      <text x="124" y="48" class="mlabel">1440 · 1920 · 390 mobile</text>
    </g>
    <g transform="translate(320 82)">
      <rect width="326" height="68" rx="12" fill="#0e1424" stroke="#26304d"/>
      <text x="20" y="40" class="metric">95/95</text>
      <text x="124" y="30" class="mlabel">automated tests passing</text>
      <text x="124" y="48" class="mlabel">17 unit · 78 end-to-end</text>
    </g>
  </g>
</svg>
